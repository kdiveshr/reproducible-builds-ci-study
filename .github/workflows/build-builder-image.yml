name: build-builder-image

# Builds the study's builder image for linux/amd64 and linux/arm64 from
# harness/builder/Dockerfile and publishes it to GHCR. All three study
# environments pull this image, so the toolchain is identical everywhere;
# each build record captures the arch-native digest actually used.
#
# NOTE: after the first publish, the package must be public for unauthenticated
# pulls from GitLab CI and local Docker. If pulls fail with access denied,
# set the package visibility to public in the repository's Packages settings.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 image build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push builder image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: harness/builder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kdiveshr/reproducible-builds-ci-study-builder:latest
            ghcr.io/kdiveshr/reproducible-builds-ci-study-builder:build-${{ github.run_number }}

      - name: Show published digests
        run: |
          echo "manifest digest: ${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect ghcr.io/kdiveshr/reproducible-builds-ci-study-builder:latest
