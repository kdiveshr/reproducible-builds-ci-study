# E2: GitLab CI environment. This file is COPIED into the GitLab project
# (GitLab.com Free has no pull mirroring, so the GitLab project holds only
# this file); each job clones the harness from this repository.
# Jobs run ONLY on the project's self-hosted runner (tag: study-runner).
# Triggered manually (web UI or API); the run form asks for the inputs below
# (GitLab's new-pipeline form has no free-form variable fields).

spec:
  inputs:
    repo_url:
      description: Target repository URL (public GitHub repo)
    commit_sha:
      description: Pinned commit SHA to build
    study_ref:
      description: Study repo ref to clone the harness from
      default: main
---
study-build:
  image:
    name: ghcr.io/kdiveshr/reproducible-builds-ci-study-builder:latest
    pull_policy: [always]
  tags:
    - study-runner
  timeout: 45m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
  variables:
    REPO_URL: "$[[ inputs.repo_url ]]"
    COMMIT_SHA: "$[[ inputs.commit_sha ]]"
    STUDY_REF: "$[[ inputs.study_ref ]]"
  script:
    - |
      if [ -z "$REPO_URL" ] || [ -z "$COMMIT_SHA" ]; then
        echo "repo_url and commit_sha inputs are required" >&2
        exit 2
      fi
    - git clone --depth 1 --branch "$STUDY_REF" https://github.com/kdiveshr/reproducible-builds-ci-study.git /tmp/study-harness
    - mkdir -p "$CI_PROJECT_DIR/out"
    - git -C /tmp/study-harness rev-parse HEAD > "$CI_PROJECT_DIR/out/harness-commit.txt"
    - export BUILDER_IMAGE="$CI_JOB_IMAGE"
    - bash /tmp/study-harness/harness/run-build.sh "$REPO_URL" "$COMMIT_SHA" E2 "$CI_PROJECT_DIR/work" "$CI_PROJECT_DIR/out"
  # Upload records/logs/fingerprints ONLY. Uploading all of out/ (incl. the
  # artifacts/ JAR copies) exceeds GitLab.com's artifact size limit on very
  # large projects (boot-ui: ~2GB -> HTTP 413, both builds lost). The builds
  # themselves are unchanged; only the upload scope is narrowed.
  artifacts:
    when: always
    paths:
      - out/harness-commit.txt
      - out/**/run-manifest.json
      - out/**/build-record.json
      - out/**/resolution-fingerprint.txt
      - out/**/build.log
      - out/**/clean.log
      - out/**/env-snapshot.txt
      - out/**/artifacts.txt
    expire_in: 90 days
